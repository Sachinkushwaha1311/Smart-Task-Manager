<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Manager</title>
    <link rel="stylesheet" href="src/output.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark bg-gray-400 min-h-screen">
    <header class="bg-blue-600 text-white">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3">
            <div class="flex items-center justify-center gap-2">
                <span class="text-lg">
                    🚀
                </span>
                <p class="text-sm font-medium">
                    Stay organized. Get more done.
                </p>
            </div>
        </div>
    </header>

    <nav class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-16">

                <a href="#" class="flex items-center gap-3 group">
                    <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold text-lg group-hover:bg-blue-700 transition">
                        ✓
                    </div>

                    <div>
                        <h1 class="text-xl font-bold text-gray-800">
                            TaskFlow
                        </h1>
                        <p class="text-xs text-gray-400">
                            Smart Task Manager
                        </p>
                    </div>
                </a>

                <div class="flex items-center gap-3">
                    <div class="hidden sm:block text-sm text-gray-500">
                        <span id="navTaskCount">0</span>
                        tasks
                    </div>

                    <button id="darkModeBtn" type="button" aria-label="Toggle dark mode"
                        class="w-10 h-10 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 transition flex items-center justify-center">
                        🌙
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
        <section class="mb-8">
            <h2 class="text-3xl sm:text-4xl font-bold text-gray-800">
                Good Morning! 👋
            </h2>
            <p class="text-gray-500 mt-2">
                Manage your task and stay productive.
            </p>
        </section>

        <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div class="bg-white rounded-xl p-6 border border-gray-200">
                <p class="text-gray-500 text-sm">
                    Total Task
                </p>
                <h3 id="totalTasks" class="text-3xl font-bold text-gray-800 mt-2">
                    0
                </h3>
            </div>

            <div class="bg-white rounded-xl p-6 border border-gray-200">
                <p class="text-gray-500 text-sm">
                    Pending
                </p>
                <h3 id="pendingTasks" class="text-3xl font-bold text-orange-500 mt-2">
                    0
                </h3>
            </div>

            <div class="bg-white rounded-xl p-6 border border-gray-200">
                <p class="text-gray-500 text-sm">
                    Completed
                </p>
                <h3 id="completedTasks" class="text-3xl font-bold text-green-500 mt-2">
                    0
                </h3>
            </div>
        </section>

        <section class="bg-white rounded-xl border border-gray-200 p-6 mb-6">
            <div class="flex flex-col sm:flex-row gap-4">

                <input type="text" id="taskInput" placeholder="What do you need to do?"
                    class="flex-1 border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 text-blue-500 focus:border-blue-500">

                <select id="priorityInput"
                    class="border border-green-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">

                    <option value="Low">Low Priority</option>
                    <option value="Medium" selected>Medium Priority</option>
                    <option value="High">High Priority</option>
                </select>

                <button id="addTaskBtn"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg transition">
                    + Add Task
                </button>
            </div>
            <p id="taskMessage" class="mt-3 hidden text-sm font-medium"></p>
        </section>

        <section class="bg-white rounded-xl border border-gray-200 p-5 mb-6">
            <div class="flex flex-col sm:flex-row gap-4">
                <div class="flex-1">
                    <input type="text" id="searchInput" placeholder="🔍 Search task..."
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <select id="filterInput"
                    class="border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">

                    <option value="all">All Task</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
        </section>

        <section>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-gray-800">
                    My Tasks
                </h2>
                <span id="taskCount" class="text-sm text-gray-500">
                    0 task
                </span>
            </div>

            <div id="taskList"></div>

            <div id="emptyState" class="bg-white rounded-xl border border-gray-200 p-10 text-center">
                <div class="text-4xl mb-3">
                    📝
                </div>
                <h3 class="text-lg font-semibold text-gray-700">
                    No Tasks found
                </h3>
                <p class="text-gray-500 mt-1">
                    Try adding a task or changing you search.
                </p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
